<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Huisstijl | Gemeenteniconen</title>
    </head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            font-family: 'Geist', snas-serif;
            display: grid;
            max-width: 80%;
            margin: 2em auto;
            gap: 1em;
            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                font-weight: 600;
                line-height: 1.25;
            }

            h1 {
                font-size: 2rem;
            }
        }
        .text {
            background-color: #fff;
            border: solid 0.25em #333;
            color: #333;
            border-radius: 1em;
            padding: 1em;
        }
        .background {
            background-color: #333;
            color: #fff;
            border-radius: 1em;
            padding: 1em;
        }

        .accent {
            background-color: #1f4ed8;
            color: #fff;
            border-radius: 1em;
            padding: 1em;
        }
    </style>
    <body>
        <img src="./assets/logo.svg" alt="Logo van Gemeenteniconen.nl" />
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
        <h4>Heading 4</h4>
        <h5>Heading 5</h5>
        <h6>Heading 6</h6>

        <p>Paragraph</p>
        <p><i>Italics</i></p>
        <p><b>Bold</b></p>

        <div class="text">
            <p>White</p>
            <p>#ffffff</p>
        </div>
        <div class="background">
            <p>Dark Gray</p>
            <p>#333333</p>
        </div>
        <div class="accent">
            <p>Mariner</p>
            <p>#1f4ed8</p>
        </div>
    </body>
</html>
